# Checks every push and pull request: formatting, clippy and Rust tests on Linux, macOS and Windows,
# and the web frontend checks.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/web-build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/web-build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --no-fail-fast: run every crate's tests and report all failures at once.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked --no-fail-fast 2>&1 | tee test.log

      # Repeats the output of every failed test at the end of the log, in the run summary and
      # as an error annotation on the run page (annotations are readable without logging in).
      - name: Show failed tests
        if: failure()
        shell: bash
        run: |
          # cargo prints each binary's failure details between two `failures:` lines.
          awk '/^failures:$/ { inside = !inside; next } inside' test.log > failures.txt || true
          cat failures.txt
          { echo '### Failed tests (${{ matrix.os }})'; echo '```'; cat failures.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          msg=$(head -c 60000 failures.txt)
          msg=${msg//'%'/'%25'}; msg=${msg//$'\r'/'%0D'}; msg=${msg//$'\n'/'%0A'}
          echo "::error title=Failed tests (${{ matrix.os }})::$msg"

  web:
    name: web (types, lint, tests, generated files)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/web-install
      - name: Check
        working-directory: web
        shell: bash
        run: |
          set -o pipefail
          pnpm check 2>&1 | tee ../check.log

      # Repeats the end of the output in the run summary and as an error annotation.
      - name: Show check output
        if: failure()
        shell: bash
        run: |
          tail -n 200 check.log > failures.txt || true
          cat failures.txt
          { echo '### pnpm check'; echo '```'; cat failures.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          msg=$(head -c 60000 failures.txt)
          msg=${msg//'%'/'%25'}; msg=${msg//$'\r'/'%0D'}; msg=${msg//$'\n'/'%0A'}
          echo "::error title=pnpm check::$msg"
