[workspace]
resolver = "2"
members = [
    "crates/ref-proto",
    "crates/ref-llm",
    "crates/ref-tools",
    "crates/ref-mcp",
    "crates/ref-config",
    "crates/refd",
    "crates/ref",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"

[workspace.dependencies]
ref-proto = { path = "crates/ref-proto" }
ref-llm = { path = "crates/ref-llm" }
ref-tools = { path = "crates/ref-tools" }
ref-mcp = { path = "crates/ref-mcp" }
ref-config = { path = "crates/ref-config" }

tokio = { version = "1.54", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json", "http2"] }
bytes = "1"
base64 = "0.22"
regex = "1"
uuid = { version = "1", features = ["v4", "v7"] }
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
xxhash-rust = { version = "0.8", features = ["xxh32"] }
ignore = "0.4"
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
unicode-width = "0.2"
rand = "0.8"
libc = "0.2"
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = "0.27"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste"] }
pulldown-cmark = { version = "0.13", default-features = false }
serde_yaml = "0.9"
similar = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
