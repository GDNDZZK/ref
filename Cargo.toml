[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"

[workspace.dependencies]
hn-proto = { path = "crates/proto" }
hn-llm = { path = "crates/llm" }
hn-tools = { path = "crates/tools" }
hn-config = { path = "crates/config" }
hn-mcp = { path = "crates/mcp" }

tokio = { version = "1.54", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
thiserror = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json", "http2"] }
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = "0.30"
clap = { version = "4.6", features = ["derive"] }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
regex = "1"
ignore = "0.4"
globset = "0.4"
xxhash-rust = { version = "0.8", features = ["xxh32"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ulid = "1"
dirs = "6"
similar = "2"
unicode-width = "0.2"
unicode-segmentation = "1"
pulldown-cmark = { version = "0.13", default-features = false }
json5 = "0.4"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
rand = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
