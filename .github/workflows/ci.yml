# Checks every push and pull request: formatting, clippy and Rust tests on Linux, macOS and Windows,
# the web frontend checks and the GUI build and tests.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/web-build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/web-build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --no-fail-fast: run every crate's tests and report all failures at once.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked --no-fail-fast 2>&1 | tee test.log

      # Repeats the output of every failed test at the end of the log, in the run summary and
      # as an error annotation on the run page (annotations are readable without logging in).
      - name: Show failed tests
        if: failure()
        shell: bash
        run: |
          # cargo prints each binary's failure details between two `failures:` lines.
          awk '/^failures:$/ { inside = !inside; next } inside' test.log > failures.txt || true
          cat failures.txt
          { echo '### Failed tests (${{ matrix.os }})'; echo '```'; cat failures.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          msg=$(head -c 60000 failures.txt)
          msg=${msg//'%'/'%25'}; msg=${msg//$'\r'/'%0D'}; msg=${msg//$'\n'/'%0A'}
          echo "::error title=Failed tests (${{ matrix.os }})::$msg"

  web:
    name: web (types, lint, tests, generated files)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/web-install
      - name: Check
        working-directory: web
        shell: bash
        run: |
          set -o pipefail
          pnpm check 2>&1 | tee ../check.log

      # Repeats the end of the output in the run summary and as an error annotation.
      - name: Show check output
        if: failure()
        shell: bash
        run: |
          tail -n 200 check.log > failures.txt || true
          cat failures.txt
          { echo '### pnpm check'; echo '```'; cat failures.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          msg=$(head -c 60000 failures.txt)
          msg=${msg//'%'/'%25'}; msg=${msg//$'\r'/'%0D'}; msg=${msg//$'\n'/'%0A'}
          echo "::error title=pnpm check::$msg"

  gui:
    name: gui (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/gui-deps

      # Two of the GUI tests start the real backend.
      - name: Build ref-server
        shell: bash
        run: |
          # Git Bash puts its own /usr/bin/link (GNU ln) before the MSVC linker that rustc runs.
          [[ "$RUNNER_OS" == Windows ]] && mv /usr/bin/link.exe /usr/bin/link-gnu.exe
          cargo build -p ref-server --locked
          path="$PWD/target/debug/ref-server"
          # Git Bash writes /d/a/... for D:\a\...; CMake, the tests and ref-server's launcher need
          # a path Windows understands (D:/a/...).
          [[ "$RUNNER_OS" == Windows ]] && path="$(cygpath -m "$path.exe")"
          echo "REF_SERVER_BIN=$path" >> "$GITHUB_ENV"

      - uses: ./.github/actions/gui-build
        with:
          cmake-args: -DREF_SERVER=${{ env.REF_SERVER_BIN }}

      - name: Test
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          # Windows has no rpath: the DLLs are found through PATH. A path with a drive letter
          # (D:/a/...) would be split at the colon by bash, so it goes in as /d/a/....
          qt_bin="$REF_QT_DIR/bin"
          deps_bin="$REF_DEPS_DIR/prefix/bin"
          if command -v cygpath > /dev/null; then
            qt_bin="$(cygpath -u "$qt_bin")"
            deps_bin="$(cygpath -u "$deps_bin")"
          fi
          export PATH="$qt_bin:$deps_bin:$PATH"
          export QML_IMPORT_PATH="$REF_DEPS_DIR/prefix/lib/qml"
          ctest --test-dir "$REF_GUI_BUILD_DIR" --output-on-failure 2>&1 | tee ctest.log

      - name: Show failed GUI tests
        if: failure()
        shell: bash
        run: |
          tail -n 300 ctest.log > failures.txt || true
          cat failures.txt
          { echo '### GUI tests (${{ matrix.os }})'; echo '```'; cat failures.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          msg=$(head -c 60000 failures.txt)
          msg=${msg//'%'/'%25'}; msg=${msg//$'\r'/'%0D'}; msg=${msg//$'\n'/'%0A'}
          echo "::error title=GUI tests (${{ matrix.os }})::$msg"

  # The tests of use-after-free and lifetime fixes only fail under AddressSanitizer. Debug,
  # because the optimizer's -Wmaybe-uninitialized warnings are errors in the sanitizer build.
  gui-sanitizers:
    name: gui tests with ASan and UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/gui-deps

      - name: Build ref-server
        run: |
          cargo build -p ref-server --locked
          echo "REF_SERVER_BIN=$PWD/target/debug/ref-server" >> "$GITHUB_ENV"

      - uses: ./.github/actions/gui-build
        with:
          build-type: Debug
          cmake-args: -DREFGUI_SANITIZE=ON -DREF_SERVER=${{ env.REF_SERVER_BIN }}

      # Any ASan, UBSan or LeakSanitizer report ends the test that hit it with an error.
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          export REF_STATE_DIR="$RUNNER_TEMP/ref-state" REF_DATA_DIR="$RUNNER_TEMP/ref-data"
          export QML_IMPORT_PATH="$REF_DEPS_DIR/prefix/lib/qml"
          ctest --test-dir "$REF_GUI_BUILD_DIR" --output-on-failure
